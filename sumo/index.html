<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#162442">
<title>Cold Medal · Firn</title>

<style>/* oberflaeche/rahmen.css – Aussehen des Rahmens für neue Spiele (rahmen.js), Farben und Schriften wie Schneeball und Skispringen. */
:root {
  --paper: #F1E7D2; --paper-2: #E6D6B7; --ink: #1E2734; --ink-deep: #141B25; --red: #C23B2A; --blue: #23466B; --gold: #DDA43B; --green: #3F6B55;
  --muted: #6E6656; --good: #6E9A4E; --warn: #D9682B; --ice: #7FB3D5;
  --font-display: "Futura", "Avenir Next Condensed", "Bahnschrift Condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
  --font-label: var(--font-display);
  --font-body: "Iowan Old Style", "Charter", "Georgia", serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #0E1626; overflow: hidden; }
body { font-family: var(--font-body); color: var(--ink); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
html, body, body * { -webkit-hyphens: manual; hyphens: manual; }
button, input, select { font: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
a.mid { text-decoration: none; color: inherit; display: block; }
#wrap { position: fixed; inset: 0; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 844px; height: 390px; transform-origin: 0 0; overflow: hidden; background: #C7DAE5; }
#cv { position: absolute; inset: 0; width: 844px; height: 390px; display: block; touch-action: none; }
.grain { position: absolute; inset: 0; pointer-events: none; opacity: 0.08;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.3  0 0 0 0 0.25  0 0 0 0 0.15  0 0 0 0.9 0'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>"); }
.kicker { font-family: var(--font-display); font-size: 11px; letter-spacing: 0.2em; font-weight: 600; color: var(--red); text-transform: uppercase; white-space: nowrap; }
[hidden] { display: none !important; }

.scr { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 14px 18px; }
.card { position: relative; background: var(--paper); border: 3px solid var(--ink-deep); box-shadow: 5px 5px 0 rgba(0,0,0,0.4); padding: 14px 16px; }
#scrStand, #scrInfo, #scrPass { background: rgba(14,22,38,0.38); }
h2 { font-family: var(--font-display); font-size: 21px; line-height: 1.3; text-transform: uppercase; margin: 1px 0 6px; white-space: nowrap; overflow: hidden; flex: none; }
.col { display: flex; flex-direction: column; gap: 7px; }
.row2 { display: flex; gap: 7px; }
.row2 > * { flex: 1 1 0; min-width: 0; }
.big, .mid { font-family: var(--font-display); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; border: 2px solid var(--ink-deep); background: var(--paper); white-space: nowrap; }
.big { display: flex; flex-direction: column; align-items: flex-start; padding: 6px 10px; font-size: 18px; box-shadow: 3px 3px 0 var(--ink-deep); text-align: left; }
.big > span { display: block; overflow: hidden; align-self: stretch; width: 100%; line-height: 1.1; }
.big small { display: block; align-self: stretch; overflow: hidden; font-family: var(--font-body); font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 12px; line-height: 1.2; opacity: 0.85; white-space: nowrap; }
.mid { padding: 8px 6px; font-size: 12.5px; letter-spacing: 0.03em; text-align: center; line-height: 1.15; box-shadow: 2px 2px 0 var(--ink-deep); overflow: hidden; }
.rpBtns .mid { padding: 9px 14px; font-size: 14px; }
.red { background: var(--red); color: var(--paper); }
.big:active, .mid:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink-deep); }
.foot { font-size: 10.5px; line-height: 1.25; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.lnk { text-decoration: underline; font-size: 10.5px; color: var(--ink); padding: 0; }
.done { position: absolute; right: 16px; bottom: 14px; }
.rpBtns { display: flex; justify-content: flex-end; gap: 8px; }

/* Startbildschirm als Plakat: links Titel über der Szene, rechts das Programm */
#scrMenu { justify-content: space-between; align-items: center; padding: 16px 24px 16px 26px; background: radial-gradient(ellipse 62% 70% at 18% 18%, rgba(14,22,38,0.62), rgba(14,22,38,0) 72%); }
#scrMenu .hero { align-self: flex-start; margin-top: 8px; max-width: 420px; pointer-events: none; }
#scrMenu .heroK { font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--paper); text-shadow: 0 1px 0 rgba(0,0,0,0.5); }
#scrMenu .heroT { font-family: var(--font-display); font-weight: 800; font-size: 52px; line-height: 0.92; letter-spacing: 0.01em; text-transform: uppercase; color: var(--paper);
  text-shadow: 4px 4px 0 var(--ink-deep), 0 0 24px rgba(0,0,0,0.25); margin-top: 4px; }
#scrMenu .heroT span { color: #F4C9A0; display: block; }
#scrMenu .ribbon { display: inline-block; margin-top: 10px; padding: 4px 14px 4px 12px; background: var(--red); color: var(--paper); font-family: var(--font-display); font-weight: 700;
  font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; box-shadow: 3px 3px 0 var(--ink-deep); transform: rotate(-2deg); white-space: nowrap; }
#scrMenu .heroP { display: block; width: fit-content; margin-top: 10px; padding: 3px 8px; background: rgba(14,22,38,0.55); max-width: 300px; font-size: 13px; line-height: 1.3; color: var(--paper); text-shadow: 0 1px 2px rgba(0,0,0,0.7); font-style: italic; }
#scrMenu .card.menu { width: 318px; max-height: 100%; display: flex; flex-direction: column; gap: 8px; padding: 12px 14px 10px; transform: rotate(0.6deg); }
#scrMenu .card.menu::before { content: ""; position: absolute; left: 50%; top: -9px; width: 46px; height: 16px; margin-left: -23px; background: rgba(230,214,183,0.85); transform: rotate(-3deg); box-shadow: 0 1px 2px rgba(0,0,0,0.2); }

/* Endstand */
.card.stand { width: 540px; max-height: 100%; display: flex; flex-direction: column; }
.stScroll { overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; min-height: 0; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
td { padding: 2px 5px; border-bottom: 1px solid rgba(30,39,52,0.15); white-space: nowrap; }
td.n { text-align: right; font-family: var(--font-display); font-variant-numeric: tabular-nums; }
td.p { width: 26px; font-family: var(--font-display); }
td.nm { overflow: hidden; text-overflow: ellipsis; max-width: 190px; }
td.t { font-family: var(--font-display); font-size: 11.5px; color: var(--muted); }
tr.hd td { font-family: var(--font-display); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
tr.me td { background: var(--gold); font-weight: 700; }
tr.cut td { border-bottom: 2px dashed var(--red); }
.stand .note { margin: 7px 0 8px; }

/* Info */
.card.info { width: 100%; height: 100%; display: flex; flex-direction: column; }
.ifBody { overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; padding-right: 8px; margin: 6px 0 44px; columns: 2; column-gap: 22px; }
.ifBody h3 { font-family: var(--font-display); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; margin: 6px 0 2px; break-after: avoid; }
.ifBody p { font-size: 12.5px; line-height: 1.35; margin-bottom: 4px; }

/* Im Spiel */
#hud { position: absolute; inset: 0; pointer-events: none; }
#hud button, #hud .cs-stick { pointer-events: auto; }
#chips { position: absolute; left: 10px; top: 8px; display: flex; gap: 5px; flex-wrap: wrap; max-width: 760px; }
.chip { font-family: var(--font-display); font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; padding: 3px 7px; background: rgba(241,231,210,0.92); border: 2px solid var(--ink-deep); color: var(--ink); white-space: nowrap; }
.chip.dark { background: var(--ink); color: var(--paper); }
.chip.good { background: var(--green); color: var(--paper); }
.chip.warn { background: var(--warn); color: var(--paper); }
.chip.gold { background: var(--gold); }
.ibtn { position: absolute; right: 10px; top: 8px; width: 34px; height: 34px; border: 2px solid var(--ink-deep); background: rgba(241,231,210,0.92); font-size: 22px; line-height: 1; font-family: var(--font-display); }
#say { position: absolute; left: 50%; top: 92px; transform: translateX(-50%) rotate(-1.5deg); background: #F4EBDA; color: #3A2A1C; border: 2px solid #3A2A1C; padding: 5px 14px;
  font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: 0.02em; box-shadow: 3px 3px 0 rgba(0,0,0,0.25); pointer-events: none; white-space: nowrap; animation: sayIn 0.25s ease-out; }
#say.bad { color: #9E2B1E; }
@keyframes sayIn { from { opacity: 0; transform: translateX(-50%) translateY(-8px) rotate(-1.5deg); } to { opacity: 1; } }
#hud .cs-hint.cs-oben { top: 48px; }

/* Auswahl vor einem Durchgang */
#scrWahl { background: rgba(14,22,38,0.38); }
.card.wahl { width: 560px; max-height: 100%; display: flex; flex-direction: column; }
.waBody { display: flex; flex-direction: column; gap: 7px; margin-bottom: 8px; }
.waRow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.waLbl { font-family: var(--font-display); font-weight: 600; letter-spacing: 0.04em; font-size: 13px; text-transform: uppercase; white-space: nowrap; }
.waSeg { display: flex; gap: 5px; flex: 0 1 auto; min-width: 0; }
.pill { font-family: var(--font-display); font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; border: 2px solid var(--ink-deep); background: var(--paper); white-space: nowrap; font-size: 12.5px; padding: 6px 10px; min-width: 34px; overflow: hidden; }
.pill.on { background: var(--ink); color: var(--paper); }
.pill:active { transform: translate(1px, 1px); }
.wahl .note { margin: 0 0 8px; }

/* Cold Medal Games · Fenster „Deine Figur“ (pass/pass.css)
   Aussehen wie die Menüs des Skispringens: Papier mit Doppelrahmen, Knöpfe wie Druckmarken, Futura für Titel und Knöpfe,
   Buchschrift für Lesetext. Farben und Schriften kommen aus den Variablen des Spiels (alle Spiele der Reihe haben sie),
   sonst gelten die Werte des Skispringens. Nur Klassen mit ps-, damit nichts im Spiel verrutscht. Grundstock für oberflaeche/. */
.ps-dialog {
  --ps-paper: var(--paper, #F1E7D2); --ps-ink: var(--ink, #1E2734); --ps-ink-deep: var(--ink-deep, #141B25);
  --ps-red: var(--red, #C23B2A); --ps-warn: var(--warn, #D9682B);
  --ps-text: #1E2734; --ps-text-2: #3A4454; --ps-muted: #786D59;
  --ps-row: rgba(30, 39, 52, 0.055); --ps-row-2: rgba(30, 39, 52, 0.1); --ps-line: rgba(30, 39, 52, 0.22); --ps-line-2: rgba(30, 39, 52, 0.45);
  --ps-hi: #B23524; --ps-hi-ink: #FBF4E4;
  --ps-display: var(--font-display, "Futura", "Avenir Next Condensed", "Bahnschrift Condensed", "Roboto Condensed", "Arial Narrow", sans-serif);
  --ps-body: var(--font-body, "Iowan Old Style", "Charter", "Georgia", serif);
  --ps-label: var(--font-label, "Futura", "Avenir Next", "Segoe UI", Roboto, Arial, sans-serif);
  display: flex; flex-direction: column; gap: 10px; box-sizing: border-box;
  width: 760px; max-width: calc(100% - 32px); max-height: calc(100% - 20px); overflow: auto; padding: 14px 20px 16px; touch-action: pan-y;
  color: var(--ps-text); font-family: var(--ps-body); text-align: left;
  background-color: var(--ps-paper);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.36  0 0 0 0 0.28  0 0 0 0 0.16  0 0 0 0.075 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  border: 2px solid var(--ps-ink-deep); border-radius: 4px;
  box-shadow: inset 0 0 0 4px var(--ps-paper), inset 0 0 0 5px rgba(30, 39, 52, 0.38), 0 5px 0 rgba(8, 12, 18, 0.5);
  -webkit-user-select: none; user-select: none;
}
.ps-dialog *, .ps-dialog *::before, .ps-dialog *::after { box-sizing: border-box; }
.ps-dialog [hidden] { display: none !important; }
.ps-dialog button, .ps-dialog input, .ps-dialog select, .ps-stage { -webkit-tap-highlight-color: transparent; }
.ps-dialog button:focus-visible, .ps-dialog input:focus-visible, .ps-dialog select:focus-visible, .ps-stage:focus-visible { outline: 2px solid var(--ps-hi); outline-offset: 2px; }

/* Kopf: Titel in Versalien, rechts nur „Fertig“ */
.ps-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.ps-title { margin: 0; font-family: var(--ps-display); font-style: normal; font-weight: 800; font-size: 32px; line-height: 34px;
  letter-spacing: 0.015em; text-transform: uppercase; color: var(--ps-ink); text-wrap: balance; }
.ps-btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 18px; margin: 0;
  border-radius: 4px; font-family: var(--ps-display); font-weight: 700; font-size: 19px; letter-spacing: 0.07em; text-transform: uppercase;
  white-space: nowrap; cursor: pointer; }
.ps-btn svg { display: block; flex: none; }
.ps-btn-1 { background: var(--ps-red); color: #FBF4E4; border: 2px solid var(--ps-ink-deep);
  box-shadow: inset 0 0 0 2px var(--ps-red), inset 0 0 0 3px rgba(251, 244, 228, 0.5), 0 3px 0 var(--ps-ink-deep); }
.ps-btn-2 { background: var(--ps-paper); color: var(--ps-ink); border: 2px solid var(--ps-ink-deep); box-shadow: 0 3px 0 var(--ps-ink-deep); }
.ps-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ps-ink-deep); }
.ps-btn:disabled { opacity: 0.55; cursor: default; }

/* links die Figur (antippen wechselt die Haltung), rechts die Reiter */
.ps-grid { display: grid; grid-template-columns: 268px minmax(0, 1fr); gap: 20px; align-items: start; }
.ps-left { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.ps-stage { height: 236px; border-radius: 4px; overflow: hidden; border: 2px solid var(--ps-ink-deep); background: #E9E4D3; cursor: pointer;
  box-shadow: 0 3px 0 rgba(20, 27, 37, 0.35); }
.ps-stage:active { transform: translateY(1px); box-shadow: 0 2px 0 rgba(20, 27, 37, 0.35); }
.ps-canvas { display: block; width: 100%; height: 100%; }
.ps-cap { margin: 0; font-family: var(--ps-body); font-size: 12.5px; line-height: 16px; color: var(--ps-muted); text-align: center; }
.ps-opts { display: flex; flex-direction: column; gap: 8px; min-width: 0; }

/* Reiter über die ganze Breite */
.ps-seg { display: flex; flex-shrink: 0; border: 2px solid var(--ps-line-2); border-radius: 4px; overflow: hidden; }
.ps-seg button { height: 34px; margin: 0; padding: 0 10px; border: none; border-radius: 0; background: transparent; color: var(--ps-text-2);
  font-family: var(--ps-display); font-weight: 700; font-size: 16px; letter-spacing: 0.04em; cursor: pointer; }
.ps-seg button + button { border-left: 1px solid var(--ps-line); }
.ps-seg button[aria-checked="true"] { background: var(--ps-hi); color: var(--ps-hi-ink); }
.ps-tabs { align-self: stretch; border-color: var(--ps-ink-deep); }
.ps-tabs button { flex: 1 1 auto; padding: 0 8px; }
.ps-tabbox { display: flex; flex-direction: column; gap: 6px; }

/* Zeilen, Farbfelder, Eingaben */
.ps-row { display: flex; align-items: center; justify-content: flex-start; gap: 12px; min-height: 32px; }
.ps-lbl { flex: none; width: 92px; font-size: 15px; font-weight: 600; color: var(--ps-text-2); white-space: normal;
  -webkit-hyphens: auto; hyphens: auto; overflow-wrap: break-word; }
.ps-row-wrap { align-items: flex-start; }
.ps-row-wrap .ps-lbl { padding-top: 7px; }
.ps-swatches { display: flex; flex-wrap: wrap; gap: 5px 7px; max-width: calc(var(--ps-per, 8) * 39px - 7px); }
.ps-swatch { width: 32px; height: 32px; margin: 0; padding: 0; border-radius: 16px; border: 2px solid transparent; cursor: pointer;
  box-shadow: 0 0 0 1px rgba(30, 39, 52, 0.18) inset; }
.ps-swatch[aria-checked="true"] { border-color: var(--ps-text); box-shadow: 0 0 0 2px rgba(17, 25, 36, 0.9) inset; }
.ps-dim .ps-swatches { opacity: 0.35; }
.ps-name, .ps-select, .ps-input { height: 38px; margin: 0; padding: 0 12px; border-radius: 3px; border: 1px solid var(--ps-line-2); background: var(--ps-row);
  color: var(--ps-text); font-family: var(--ps-display); font-weight: 700; font-size: 19px; letter-spacing: 0.04em; }
.ps-name, .ps-input { flex: 1; min-width: 0; width: auto; text-transform: uppercase; -webkit-user-select: text; user-select: text; }
.ps-name.ps-mixed { text-transform: none; }
.ps-name::placeholder, .ps-input::placeholder { color: var(--ps-muted); opacity: 1; text-transform: none; letter-spacing: 0.02em; }
.ps-select option { background: #FBF4E4; color: #1E2734; }
.ps-id { gap: 10px; }
.ps-id .ps-nation { flex: none; width: 172px; }
.ps-row-sel { gap: 10px; }
.ps-row-sel .ps-select { flex: 1; min-width: 0; width: auto; }
.ps-need { outline: 3px solid var(--ps-warn); outline-offset: 1px; }
.ps-hint { margin: 2px 0 0; max-width: 420px; font-family: var(--ps-body); font-size: 12.5px; line-height: 17px; color: var(--ps-muted); }
.ps-plain { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 32px; margin: 0; padding: 0 10px; border-radius: 4px;
  border: 2px solid var(--ps-line-2); background: transparent; color: var(--ps-text); font-family: var(--ps-label); font-weight: 700; font-size: 13px;
  letter-spacing: 0.04em; cursor: pointer; }
.ps-plain svg { display: block; flex: none; }
.ps-random { margin-left: auto; width: 38px; height: 38px; padding: 0; justify-content: center; }

/* erster Start: Name oder als Gast */
.ps-ask { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: -2px 0 2px;
  font-family: var(--ps-body); font-size: 12.5px; line-height: 16px; color: var(--ps-muted); }
.ps-warn { color: var(--ps-warn); font-weight: 600; }

/* Reiter Code */
.ps-codebox { gap: 7px; }
.ps-code-top { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; min-height: 36px; }
.ps-code-val { flex: 1; min-width: 0; font-family: var(--ps-display); font-weight: 800; font-size: 26px; line-height: 30px; letter-spacing: 0.1em;
  color: var(--ps-ink); white-space: nowrap; font-variant-numeric: tabular-nums; -webkit-user-select: text; user-select: text; }
.ps-code-val.ps-none { font-family: var(--ps-body); font-weight: 400; font-size: 15px; letter-spacing: 0; color: var(--ps-muted); }
.ps-code-st { margin: 0; }
.ps-codebox .ps-btn { height: 38px; padding: 0 14px; font-size: 16px; }
.ps-code-save { align-self: flex-start; }
.ps-sep { display: flex; align-items: center; gap: 10px; margin: 4px 0 0; font-family: var(--ps-label); font-weight: 700; font-size: 11px;
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--ps-muted); }
.ps-sep::after { content: ""; flex: 1; height: 1px; background: var(--ps-line); }
.ps-code-row { gap: 10px; }
.ps-code-in { letter-spacing: 0.12em; }
.ps-code-res { margin: 0; }
.ps-code-ok { gap: 10px; }

/* eigene Ebene (CMPass.ui.open) für Spiele ohne eigene Ebenen; schmale Bildschirme: Figur über den Reitern */
.ps-screen { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 10px;
  background: rgba(17, 25, 36, 0.55); }
.ps-screen[hidden] { display: none; }
@media (max-width: 640px) {
  .ps-screen .ps-dialog { width: 100%; max-width: 100%; max-height: 100%; padding: 12px 14px 14px; }
  .ps-screen .ps-title { font-size: 24px; line-height: 27px; }
  .ps-screen .ps-head .ps-btn { height: 40px; padding: 0 14px; font-size: 17px; }
  .ps-screen .ps-grid { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .ps-screen .ps-stage { height: 190px; }
  .ps-screen .ps-row { gap: 8px; }
  .ps-screen .ps-lbl { width: 60px; }
  .ps-screen .ps-seg button { padding: 0 7px; }
  .ps-screen .ps-random { width: 36px; }
  .ps-screen .ps-swatches { gap: 5px; max-width: calc(var(--ps-per, 8) * 33px - 5px); }
  .ps-screen .ps-swatch { width: 28px; height: 28px; border-radius: 14px; }
  .ps-screen .ps-name, .ps-screen .ps-select, .ps-screen .ps-input { padding: 0 8px; font-size: 17px; }
  .ps-screen .ps-id .ps-nation { width: 150px; }
  .ps-screen .ps-code-val { flex: none; font-size: 21px; letter-spacing: 0.04em; }
}
@media (prefers-reduced-motion: reduce) { .ps-btn:active, .ps-stage:active { transform: none; } }

/* 14.11.2026 (Mat: „das Figurenmenü muss vereinheitlicht und schöner gestaltet werden“, iPhone-Schriften laufen breiter):

<script>// kulisse/einfach.js – einfache Plakat-Kulisse für Kameras ohne Schanze (Loipe, Eisfläche, Kurs, Rampe), global CMKulisse.einfach.
// Seit 15.11.2026 (Reihen-Chat, Version 0.1 der neuen Spiele). Braucht keine andere Datei. Drei vorgerenderte Ebenen
// (Himmel, fern, mittel), die sich nahtlos wiederholen und mit Parallaxe verschieben lassen; je Ort Form der Berge,
// Farben und zwei, drei Wahrzeichen. Die großen Plakat-Orte (plakat.js, panorama.js) bleiben, wie sie sind; ein Ort
// kann später dorthin umziehen, ohne dass sich hier der Aufruf ändert.
//   const k = CMKulisse.einfach.baue("idre", { W: 844, H: 390, hor: 200, dpr: 2, zeit: "tag" | "abend" });
//   k.zeichne(ctx, cx, t)   cx = Kameraweg in Pixeln (nahe Ebene), t = Sekunden (Sterne, Lichter)
(function (root) {
  "use strict";
  const K = (root.CMKulisse = root.CMKulisse || {});
  const TAU = Math.PI * 2;
  function rng(seed) { let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
  const hash = (str) => { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  function mix(a, b, t) {
    const p = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)], A = p(a), B = p(b);
    return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, "0")).join("");
  }

  // Orte: form = alpin | rund | flach | stadt; hoch = Höhe der fernen Berge (Anteil des Himmels); wald 0 … 1; teile = Wahrzeichen
  const ORTE = {
    sapporo: { land: "JPN", name: "Sapporo", form: "rund", hoch: 0.42, wald: 0.5, haus: "#D9D2C4", dach: "#3E4A5C", teile: ["skyline", "fernsehturm", "flutlicht"] },
    tokio: { land: "JPN", name: "Tokio", form: "stadt", hoch: 0.2, wald: 0, haus: "#C9CEDA", dach: "#2F3A4E", teile: ["skyline", "skyline", "fernsehturm"] },
    nozawa: { land: "JPN", name: "Nozawa Onsen", form: "alpin", hoch: 0.6, wald: 0.8, haus: "#E9DFC8", dach: "#5A3B2A", teile: ["dorf", "dampf"] },
    idre: { land: "SWE", name: "Idre Fjäll", form: "rund", hoch: 0.5, wald: 0.9, haus: "#A8322A", dach: "#2B2B2B", teile: ["dorf", "flutlicht"] },
    heerenveen: { land: "NED", name: "Heerenveen", form: "flach", hoch: 0.06, wald: 0.25, haus: "#B9573C", dach: "#3B2C26", teile: ["muehle", "kirche", "muehle", "dorf"] },
    friesland: { land: "NED", name: "Friesland", form: "flach", hoch: 0.05, wald: 0.2, haus: "#B9573C", dach: "#3B2C26", teile: ["muehle", "dorf", "kirche"] },
    lana: { land: "ITA", name: "Lana", form: "alpin", hoch: 0.72, wald: 0.6, haus: "#EFE6D2", dach: "#6B3A2A", teile: ["kirche", "dorf", "burg", "zinnen"] },
    schnalstal: { land: "ITA", name: "Schnalstal", form: "alpin", hoch: 0.82, wald: 0.5, haus: "#EFE6D2", dach: "#6B3A2A", teile: ["dorf", "kirche"] },
    garmisch: { land: "GER", name: "Garmisch-Partenkirchen", form: "alpin", hoch: 0.8, wald: 0.75, haus: "#F1E9D6", dach: "#6A4530", teile: ["kirche", "dorf", "huette"] },
    lahti: { land: "FIN", name: "Lahti", form: "flach", hoch: 0.12, wald: 1, haus: "#C9A94F", dach: "#3A3A3A", teile: ["schanzen", "funkmast", "funkmast", "dorf"] },
    ruka: { land: "FIN", name: "Ruka", form: "rund", hoch: 0.38, wald: 1, haus: "#8E3B2E", dach: "#2B2B2B", teile: ["schanzen", "dorf"] },
    chamonix: { land: "FRA", name: "Chamonix", form: "alpin", hoch: 0.92, wald: 0.6, haus: "#EDE3CF", dach: "#5C4636", teile: ["dom", "kirche", "dorf"] },
    areches: { land: "FRA", name: "Arêches-Beaufort", form: "alpin", hoch: 0.8, wald: 0.7, haus: "#E8DCC4", dach: "#5C4636", teile: ["dorf", "huette"] },
    trysil: { land: "NOR", name: "Trysil", form: "rund", hoch: 0.4, wald: 1, haus: "#A8322A", dach: "#2B2B2B", teile: ["dorf", "kirche", "fahne"] },
    holmenkollen: { land: "NOR", name: "Holmenkollen", form: "rund", hoch: 0.3, wald: 0.9, haus: "#A8322A", dach: "#2B2B2B", teile: ["schanzen", "dorf", "fjord"] },
    toronto: { land: "CAN", name: "Toronto", form: "stadt", hoch: 0.14, wald: 0.1, haus: "#C4B8A6", dach: "#3A3F4C", teile: ["skyline", "fernsehturm", "skyline"] },
    ottawa: { land: "CAN", name: "Ottawa", form: "stadt", hoch: 0.12, wald: 0.4, haus: "#CFC3AE", dach: "#3D6B5B", teile: ["schloss", "skyline", "kirche"] },
    copper: { land: "USA", name: "Copper Mountain", form: "alpin", hoch: 0.85, wald: 0.9, haus: "#8A6A4A", dach: "#3B2F28", teile: ["huette", "dorf", "flutlicht"] },
    utah: { land: "USA", name: "Utah", form: "alpin", hoch: 0.7, wald: 0.5, haus: "#9A7658", dach: "#3B2F28", teile: ["dorf", "flutlicht"] },
    hochfilzen: { land: "AUT", name: "Hochfilzen", form: "alpin", hoch: 0.78, wald: 0.8, haus: "#EFE6D2", dach: "#6A4530", teile: ["kirche", "dorf"] },
    wien: { land: "AUT", name: "Wien", form: "stadt", hoch: 0.1, wald: 0.2, haus: "#E2D6BC", dach: "#4E6B5E", teile: ["kirche", "skyline", "schloss"] },
    stmoritz: { land: "SUI", name: "St. Moritz", form: "alpin", hoch: 0.85, wald: 0.6, haus: "#EDE3CF", dach: "#5C4636", teile: ["kirche", "dorf", "schloss"] },
  };
  const LICHT = {
    tag: { oben: "#8FBBD8", unten: "#DCE9EE", fern: "#9FB6C8", mittel: "#6E8DA5", schnee: "#F4F7F8", schatten: "#C9D8E2", wald: "#2E4A45", licht: 0 },
    abend: { oben: "#1B2B4E", unten: "#C98F7A", fern: "#4A5578", mittel: "#2E3A5C", schnee: "#B9C3DA", schatten: "#7E8BB0", wald: "#18263A", licht: 1 },
    nacht: { oben: "#0B1226", unten: "#27375E", fern: "#1F2A4A", mittel: "#172038", schnee: "#8C9AC0", schatten: "#5A688F", wald: "#0E1728", licht: 1 },
  };

  // nahtlose Kammlinie: Summe ganzzahliger Wellen über die Ebenenbreite
  function kamm(r, n, rau) {
    const w = []; for (let i = 1; i <= n; i++) w.push([i, (r() * 2 - 1) / Math.pow(i, rau), r() * TAU]);
    const norm = w.reduce((s, a) => s + Math.abs(a[1]), 0) || 1;
    return (u) => { let v = 0; for (const [f, a, p] of w) v += a * Math.sin(u * TAU * f + p); return v / norm; };
  }
  function ebene(Wl, H, dpr) { const c = document.createElement("canvas"); c.width = Math.round(Wl * dpr); c.height = Math.round(H * dpr); const x = c.getContext("2d"); x.scale(dpr, dpr); return [c, x]; }

  function berge(x, Wl, base, amp, f, form, col, schnee, schatten) {
    const zack = (u) => { const v = f(u); return form === "alpin" ? Math.sign(v) * Math.pow(Math.abs(v), 0.7) + 0.35 * Math.abs(Math.sin(u * TAU * 9 + 1)) * (v > -0.2 ? 1 : 0.3) : v; };
    const y = (px) => base - amp * (0.45 + 0.55 * zack(px / Wl));
    x.fillStyle = col; x.beginPath(); x.moveTo(0, base + 2);
    for (let px = 0; px <= Wl; px += 2) x.lineTo(px, y(px));
    x.lineTo(Wl, base + 2); x.closePath(); x.fill();
    if (schnee && form === "alpin") {   // Schneekappen: helle Flanke links vom Grat
      x.fillStyle = schnee;
      for (let px = 6; px < Wl - 6; px += 2) {
        const a = y(px - 4), b = y(px), c = y(px + 4);
        if (b < a && b < c && base - b > amp * 0.55) { x.beginPath(); x.moveTo(px, b); x.lineTo(px - amp * 0.16, b + amp * 0.2); x.lineTo(px - amp * 0.04, b + amp * 0.13); x.lineTo(px + amp * 0.03, b + amp * 0.2); x.lineTo(px + amp * 0.1, b + amp * 0.12); x.closePath(); x.fill();
          x.fillStyle = schatten; x.beginPath(); x.moveTo(px, b); x.lineTo(px + amp * 0.1, b + amp * 0.12); x.lineTo(px + amp * 0.2, b + amp * 0.26); x.lineTo(px + amp * 0.03, b + amp * 0.2); x.closePath(); x.fill(); x.fillStyle = schnee; }
      }
    }
    return y;
  }
  function wald(x, Wl, r, yAt, dichte, col, h) {
    x.fillStyle = col;
    for (let px = 0; px < Wl; px += 5 + r() * 9) { if (r() > dichte) continue; const y = yAt(px) + 2, hh = h * (0.6 + r() * 0.7), w = hh * 0.34;
      x.beginPath(); x.moveTo(px, y - hh); x.lineTo(px + w, y); x.lineTo(px - w, y); x.closePath(); x.fill(); }
  }
  const TEILE = {
    dorf(x, px, y, s, O, L, r) { for (let i = 0; i < 5; i++) { const w = (9 + r() * 7) * s, h = (6 + r() * 4) * s, hx = px + (i - 2) * 15 * s + r() * 4;
      x.fillStyle = mix(O.haus, L.mittel, L.licht * 0.55); x.fillRect(hx, y - h, w, h); x.fillStyle = L.licht ? mix(L.schnee, "#FFFFFF", 0.1) : "#FFFFFF"; x.beginPath(); x.moveTo(hx - 1.5 * s, y - h); x.lineTo(hx + w / 2, y - h - 5 * s); x.lineTo(hx + w + 1.5 * s, y - h); x.closePath(); x.fill();
      x.fillStyle = L.licht ? "#F6C766" : mix(O.dach, "#000000", 0.2); x.fillRect(hx + w * 0.3, y - h * 0.62, 2.2 * s, 2.4 * s); } },
    huette(x, px, y, s, O, L) { x.fillStyle = mix("#6B4A30", L.mittel, L.licht * 0.5); x.fillRect(px, y - 9 * s, 18 * s, 9 * s); x.fillStyle = L.schnee; x.beginPath(); x.moveTo(px - 3 * s, y - 9 * s); x.lineTo(px + 9 * s, y - 16 * s); x.lineTo(px + 21 * s, y - 9 * s); x.closePath(); x.fill(); x.fillStyle = L.licht ? "#F6C766" : "#2A1E16"; x.fillRect(px + 7 * s, y - 6 * s, 3.5 * s, 3.5 * s); },
    kirche(x, px, y, s, O, L) { const c = mix(O.haus, L.mittel, L.licht * 0.55); x.fillStyle = c; x.fillRect(px, y - 12 * s, 16 * s, 12 * s); x.fillRect(px + 16 * s, y - 22 * s, 6 * s, 22 * s);
      x.fillStyle = mix(O.dach, L.mittel, L.licht * 0.4); x.beginPath(); x.moveTo(px + 15 * s, y - 22 * s); x.lineTo(px + 19 * s, y - 36 * s); x.lineTo(px + 23 * s, y - 22 * s); x.closePath(); x.fill(); x.beginPath(); x.moveTo(px - 1 * s, y - 12 * s); x.lineTo(px + 8 * s, y - 18 * s); x.lineTo(px + 17 * s, y - 12 * s); x.closePath(); x.fill(); },
    burg(x, px, y, s, O, L) { x.fillStyle = mix("#B9AD96", L.mittel, L.licht * 0.6); x.fillRect(px, y - 14 * s, 22 * s, 14 * s); x.fillRect(px + 16 * s, y - 24 * s, 7 * s, 24 * s); for (let i = 0; i < 4; i++) x.fillRect(px + i * 6 * s, y - 16.5 * s, 3 * s, 3 * s); },
    schloss(x, px, y, s, O, L) { x.fillStyle = mix(O.haus, L.mittel, L.licht * 0.55); x.fillRect(px, y - 15 * s, 40 * s, 15 * s); x.fillStyle = mix(O.dach, L.mittel, L.licht * 0.4); for (const dx of [2, 18, 34]) { x.beginPath(); x.moveTo(px + (dx - 3) * s, y - 15 * s); x.lineTo(px + (dx + 2) * s, y - (dx === 18 ? 34 : 26) * s); x.lineTo(px + (dx + 7) * s, y - 15 * s); x.closePath(); x.fill(); } },
    muehle(x, px, y, s, O, L) { x.fillStyle = mix("#5A4334", L.mittel, L.licht * 0.5); x.beginPath(); x.moveTo(px - 5 * s, y); x.lineTo(px - 3 * s, y - 20 * s); x.lineTo(px + 3 * s, y - 20 * s); x.lineTo(px + 5 * s, y); x.closePath(); x.fill(); x.beginPath(); x.arc(px, y - 20 * s, 4 * s, Math.PI, 0); x.fill();

 * (im Skispringen: Ausrüstung) und Code (der persönliche Code der Reihe: zeigen, kopieren, online sichern, auf einem anderen
 * Gerät holen). Was man hier wählt, liegt im Pass und gilt in jedem Spiel. Aussehen wie das Skispringen (Papier, Druckmarken),
 * Klassen mit dem Präfix ps- (pass.css). Braucht figur.js und pass.js.
 *
 * const ui = CMPass.ui.mount(host, opts)   host: leeres Element, das das Spiel ein- und ausblendet (Ebene, Maßstab)
 *   opts.title        Überschrift, Standard „Deine Figur“      opts.kit     Kit der Figur in der Vorschau (figur.js KITS)
 *   opts.nations      [[Kürzel, Name], …] (sonst CMPass.NATIONS) opts.upper  Namen in Versalien (Standard ja)
 *   opts.labels       { suit: "Anzug", accent: "Zweitfarbe" }  opts.personHint  kurzer Satz unter Person
 *   opts.preview      eigene Vorschau: { poses: [[id, Name], …], pose, personPose, colorPose, draw(ctx, w, h, t, pose, look) }
 *                     (Hintergrund wie hier: CMPass.ui.backdrop(ctx, w, h))
 *   opts.tabs         eigene Reiter: [{ id, label, pose, rows: [Zeile, …] }], Zeile:
 *                       { type: "swatches", label, list: [[Wert, Name, Farbe?], …], get, set, dim?, hide? }
 *                       { type: "seg", label, list: [[Wert, Name], …], get, set, hide? }
 *                       { type: "selects", label, items: [{ list, get, set, aria }] }      { type: "hint", text }
 *   opts.code         Reiter Code: { status() → { code?, text, save?, load? }, save(), load(code) → { text, apply? } }
 *                     status: code = der gezeigte Code (sonst der im Pass, null = „noch keiner“), save = Beschriftung des Knopfs
 *                     zum Sichern (ohne: kein Knopf), load: false blendet „Auf einem anderen Gerät“ aus. Fehler als Error mit Text.
 *                     Für Spiele nur mit Pass: CMPass.ui.codeVia(rpc). Ohne opts.code kein Reiter Code.
 *   opts.random()     zusätzlich bei „Zufall“ (Ausrüstung der Sportart)     opts.onDone()  nach „Fertig“
 *   opts.defaultName  Name, wenn keiner eingegeben ist         opts.dpr()   Pixeldichte der Vorschau
 * ui.open({ ask, title, tab })   ask: erster Start, ohne Namen geht es nicht weiter (oder „Als Gast spielen“)
 * ui.refresh() · ui.done() → false, solange ein Name fehlt · ui.close() · ui.setTab(id) · ui.el (das Fenster)
 * CMPass.ui.open(opts) legt selbst eine Ebene über die Seite (für Spiele ohne eigene Ebenen) und zeigt das Fenster.
 */
(function (root) {
  "use strict";
  const P = root.CMPass, doc = root.document;
  let uid = 0;
  const mk = (tag, cls, text) => { const e = doc.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const at = (e, a) => { for (const k of Object.keys(a)) e.setAttribute(k, a[k]); return e; };
  const DICE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true">' +
    '<rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><circle cx="8.5" cy="8.5" r="1.4" fill="currentColor" stroke="none"/>' +
    '<circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.4" fill="currentColor" stroke="none"/></svg>';
  // Vorschau ohne eigene Zeichnung des Spiels: die Figur steht, jubelt, winkt oder tanzt (Gesten aus figur.js)
  const DEF_POSES = [["stand", "Stehen"], ["jubel", "Jubel"], ["winken", "Winken"], ["charleston", "Tanz"]];
  const errText = (e) => (e && e.message ? e.message : "Hat nicht geklappt. Bitte später noch einmal.");

  // Hintergrund der Vorschau: heller Plakathimmel mit blassen Bergen über Schnee. Hell, damit jede Farbe gut steht (auch
  // dunkle Anzüge und Haare); die Figur hat eine dunkle Kontur. Für eigene Vorschauen der Spiele: CMPass.ui.backdrop(…).
  function backdrop(c, w, h, o) {
    o = o || {};
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "#C7DAE5"); g.addColorStop(0.6, "#E9E4D3"); g.addColorStop(1, "#F1E7D2");
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    c.fillStyle = "rgba(35,70,107,0.12)";
    c.beginPath(); c.moveTo(0, h * 0.64);
    for (const [x, y] of [[0.14, 0.47], [0.27, 0.58], [0.45, 0.39], [0.63, 0.55], [0.8, 0.44], [1, 0.6]]) c.lineTo(w * x, h * y);
    c.lineTo(w, h); c.lineTo(0, h); c.closePath(); c.fill();
    if (o.ground !== false) {
      const y = o.groundY != null ? o.groundY : h - 12;
      c.fillStyle = "#FBF8F1"; c.fillRect(0, y, w, h - y);
      c.fillStyle = "rgba(30,39,52,0.28)"; c.fillRect(0, y, w, 1.5);
    }
  }

  function defaultDraw(c, w, h, t, pose, look, kit) {
    backdrop(c, w, h);
    const F = root.CMFigur;
    if (!F) return;
    let p = F.POSES.stand, lift = 0, mood = "ruhig";
    if (pose === "stand") p = F.idle(F.POSES.stand, t);
    else {
      const G = F.GESTEN[pose], r = G && F.gesture(pose, G.loop ? t : t % (G.dauer + 1.4));
      if (r) { p = r.pose; lift = r.lift; mood = r.mood; }
    }
    const s = Math.min(w / 64, (h - 26) / 96);
    F.draw(c, { x: w / 2, y: h - 13, s, dir: 1, pose: p, lift, look: F.cleanLook(look), kit: kit || "plain", face: true, mood });
  }

  // Eine Zeile im Fenster; sync() stellt den aktuellen Wert dar (und blendet aus, wenn hide() es will)
  function row(spec, changed) {
    if (spec.type === "hint") {
      const p = mk("p", "ps-hint", typeof spec.text === "function" ? spec.text() : spec.text);
      return { el: p, sync() { if (typeof spec.text === "function") p.textContent = spec.text(); } };
    }
    const r = mk("div", "ps-row");
    r.appendChild(mk("span", "ps-lbl", spec.label));
    const hide = () => { r.hidden = !!(spec.hide && spec.hide()); };
    if (spec.type === "swatches") {
      const box = at(mk("div", "ps-swatches"), { role: "radiogroup", "aria-label": spec.aria || spec.label });
      // mehr als acht Felder: gleich lange Reihen (10 → 5 + 5, 16 → 8 + 8)
      if (spec.list.length > 8) { r.classList.add("ps-row-wrap"); box.style.setProperty("--ps-per", Math.ceil(spec.list.length / Math.ceil(spec.list.length / 8))); }
      const bs = spec.list.map(([v, name, col]) => {
        const b = at(mk("button", "ps-swatch"), { type: "button", role: "radio", "aria-label": name, "aria-checked": "false" });
        b.style.background = col || v; b._v = v; box.appendChild(b); return b;
      });
      box.addEventListener("click", (e) => { const b = e.target.closest(".ps-swatch"); if (b && box.contains(b)) { spec.set(b._v); changed(spec); } });
      r.appendChild(box);
      return { el: r, sync() { hide(); const v = spec.get(); for (const b of bs) b.setAttribute("aria-checked", String(b._v === v)); r.classList.toggle("ps-dim", !!(spec.dim && spec.dim())); } };
    }
    if (spec.type === "seg") {
      const box = at(mk("div", "ps-seg"), { role: "radiogroup", "aria-label": spec.aria || spec.label });
      const bs = spec.list.map(([v, name]) => { const b = at(mk("button", null, name), { type: "button", role: "radio", "aria-checked": "false" }); b._v = v; box.appendChild(b); return b; });
      box.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b && box.contains(b)) { spec.set(b._v); changed(spec); } });
      r.appendChild(box);
      return { el: r, sync() { hide(); const v = spec.get(); for (const b of bs) b.setAttribute("aria-checked", String(b._v === v)); } };
    }
    // mehrere Auswahllisten in einer Zeile (Frisur und Bart)
    r.classList.add("ps-row-sel");
    const sels = (spec.items || []).map((it) => {
      const s = at(mk("select", "ps-select"), { "aria-label": it.aria || spec.label });
      for (const [v, name] of it.list) { const o = mk("option", null, name); o.value = String(v); s.appendChild(o); }
      s.addEventListener("change", () => { const hit = it.list.find(([v]) => String(v) === s.value); if (hit) { it.set(hit[0]); changed(spec); } });
      r.appendChild(s);
      return [s, it];
    });
    return { el: r, sync() { hide(); for (const [s, it] of sels) s.value = String(it.get()); } };
  }

  // Reiter Code: der persönliche Code der Reihe (zeigen, kopieren), online sichern, auf einem anderen Gerät holen
  function codeTab(code, stop) {
    const box = mk("div", "ps-tabbox ps-codebox");
    const top = mk("div", "ps-code-top"), val = mk("b", "ps-code-val");
    const bCopy = at(mk("button", "ps-plain", "Kopieren"), { type: "button" });
    top.append(mk("span", "ps-lbl", "Dein Code"), val, bCopy);
    const st = mk("p", "ps-hint ps-code-st");
    const bSave = at(mk("button", "ps-btn ps-btn-2 ps-code-save"), { type: "button" });
    const sep = mk("p", "ps-sep", "Auf einem anderen Gerät");
    const inRow = mk("div", "ps-row ps-code-row");
    const inCode = at(mk("input", "ps-input ps-code-in"), { type: "text", maxlength: "16", autocomplete: "off", spellcheck: "false", "aria-label": "Code eingeben", placeholder: "Code eingeben" });
    const bGet = at(mk("button", "ps-btn ps-btn-2 ps-code-get", "Holen"), { type: "button" });
    inRow.append(inCode, bGet);
    const res = mk("p", "ps-hint ps-code-res"); res.hidden = true;
    const okRow = mk("div", "ps-row ps-code-ok"); okRow.hidden = true;
    const bYes = at(mk("button", "ps-btn ps-btn-1 ps-code-yes", "Laden"), { type: "button" }), bNo = at(mk("button", "ps-plain", "Abbrechen"), { type: "button" });
    okRow.append(bYes, bNo);
    box.append(top, st, bSave, sep, inRow, res, okRow);
    let pending = null, busy = false, shownCode = "";
    // Rückfrage zum Laden: dann nur noch sie (der obere Teil hat Pause), damit alles ins Fenster passt
    const ask = (on) => { okRow.hidden = !on; top.hidden = st.hidden = on; if (on) bSave.hidden = true; else sync(); };
    function sync() {
      const s = (code.status && code.status()) || {}, c = "code" in s ? s.code : P.get().code;
      shownCode = P.codeOk(c) ? c : "";
      val.textContent = shownCode ? P.fmtCode(shownCode) : "noch keiner";
      val.classList.toggle("ps-none", !shownCode);
      bCopy.hidden = !shownCode;
      st.textContent = s.text || "";
      bSave.textContent = s.save || ""; bSave.hidden = !s.save;
      // Holen geht nur, wenn das Spiel online ist (s.load === false: aus oder keine Verbindung möglich)
      const canLoad = s.load !== false;
      sep.hidden = inRow.hidden = !canLoad;
      if (!canLoad) { pending = null; okRow.hidden = true; res.hidden = true; }
      if (pending) { top.hidden = st.hidden = bSave.hidden = true; } else { top.hidden = st.hidden = false; }
    }
    bCopy.addEventListener("click", async () => {
      const t = P.fmtCode(shownCode);
      try { await root.navigator.clipboard.writeText(t); bCopy.textContent = "Kopiert"; }
      catch (e) { const rg = doc.createRange(); rg.selectNodeContents(val); const sel = root.getSelection(); sel.removeAllRanges(); sel.addRange(rg); bCopy.textContent = "Markiert"; }
      setTimeout(() => { bCopy.textContent = "Kopieren"; }, 1800);
    });
    bSave.addEventListener("click", async () => {
      if (busy) return;
      busy = true; bSave.disabled = true;
      try { await code.save(); sync(); } catch (e) { sync(); st.textContent = errText(e); }
      busy = false; bSave.disabled = false;
    });
    bGet.addEventListener("click", async () => {
      const c = P.parseCode(inCode.value);
      if (pending) { pending = null; ask(false); }
      res.hidden = false; res.classList.remove("ps-warn");
      if (!c) { res.textContent = "Kein gültiger Code: 12 Zeichen, zum Beispiel K7PM-3QXD-9TRA."; res.classList.add("ps-warn"); return; }
      res.textContent = "Suche …"; bGet.disabled = true;
      try { const r = await code.load(c); res.textContent = r.text; if (r.apply) { pending = r.apply; ask(true); } }
      catch (e) { res.textContent = errText(e); res.classList.add("ps-warn"); }
      bGet.disabled = false;
    });
    bYes.addEventListener("click", () => { const f = pending; if (!f) return; pending = null; ask(false); res.hidden = true; inCode.value = ""; f(); });
    bNo.addEventListener("click", () => { pending = null; ask(false); res.hidden = true; inCode.value = ""; });
    inCode.addEventListener("keydown", (e) => { if (e.key === "Enter") bGet.click(); stop(e); });
    return { box, sync };
  }

  function mount(host, opts) {
    opts = opts || {};
    const F = root.CMFigur, id = ++uid, upper = opts.upper !== false;
    const pv = opts.preview || { poses: DEF_POSES, pose: "stand" };
    const lbl = Object.assign({ suit: "Anzug", accent: "Zweitfarbe" }, opts.labels || {});
    const look = () => P.get().look;
    const setLook = (patch) => P.set({ look: patch, edited: true }, "ui");
    const personPose = pv.personPose || pv.pose || pv.poses[0][0];
    let tab = "person", pose = personPose, ask = false, shown = false, raf = 0, openedAt = 0;
    // Tasten beim Tippen nicht ans Spiel weitergeben, außer Escape (schließt das Fenster)
    const stop = (e) => { if (e.key !== "Escape") e.stopPropagation(); };

    // ---------------------------------------------------------------- Aufbau: Kopf nur Titel und Fertig
    const dlg = at(mk("div", "ps-dialog"), { role: "dialog", "aria-labelledby": "psTitle" + id });
    const head = mk("div", "ps-head"), title = at(mk("h2", "ps-title", opts.title || "Deine Figur"), { id: "psTitle" + id });
    const bDone = at(mk("button", "ps-btn ps-btn-1 ps-done", "Fertig"), { type: "button" });
    head.append(title, bDone);

    // links: die Figur; antippen wechselt die Haltung
    const grid = mk("div", "ps-grid"), left = mk("div", "ps-left"), opt = mk("div", "ps-opts");
    const stage = at(mk("div", "ps-stage"), { role: "button", tabindex: "0", "aria-label": "Haltung der Figur wechseln" });
    const cv = at(mk("canvas", "ps-canvas"), { role: "img", "aria-label": "Vorschau deiner Figur" });
    const cap = mk("p", "ps-cap");
    stage.appendChild(cv); left.append(stage, cap);
    const poseName = () => (pv.poses.find((x) => x[0] === pose) || pv.poses[0])[1];
    const nextPose = () => { const i = pv.poses.findIndex((x) => x[0] === pose); pose = pv.poses[(i + 1) % pv.poses.length][0]; refresh(); };
    stage.addEventListener("click", nextPose);
    stage.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); nextPose(); } });

    // Person: Name und Land, dann der Kopf
    const idRow = mk("div", "ps-row ps-id");
    const inName = at(mk("input", "ps-name"), { type: "text", maxlength: "12", autocomplete: "off", spellcheck: "false", "aria-label": "Name", placeholder: "Dein Name" });
    if (!upper) inName.classList.add("ps-mixed");
    const selNat = at(mk("select", "ps-select ps-nation"), { "aria-label": "Land" });
    for (const [c, n] of opts.nations || P.NATIONS) { const o = mk("option", null, n); o.value = c; selNat.appendChild(o); }
    idRow.append(inName, selNat);
    const askRow = mk("div", "ps-ask"), askTxt = mk("span", "ps-ask-txt"), bGuest = at(mk("button", "ps-plain", "Als Gast spielen"), { type: "button" });
    askRow.append(askTxt, bGuest); askRow.hidden = true;
    const ASK = "Dein Name steht auf den Tafeln und in den Gruppen, in allen Spielen.";
    const person = [
      { type: "selects", label: "Frisur", head: true, items: [
        { aria: "Frisur", list: F.HAIRS.map((n, i) => [i, n]), get: () => look().hair, set: (v) => setLook({ hair: v }) },
        { aria: "Bart", list: F.BEARDS.map((n, i) => [i, i ? n : "ohne Bart"]), get: () => look().beard, set: (v) => setLook({ beard: v }) }] },
      { type: "swatches", label: "Haare", aria: "Haarfarbe", head: true, list: F.HAIRC.map((c, i) => [i, P.HAIRC_NAMES[i] || "Haarfarbe " + (i + 1), c]), get: () => look().hairC, set: (v) => setLook({ hairC: v }) },
      { type: "swatches", label: "Haut", aria: "Hautton", head: true, list: F.SKIN.map((c, i) => [i, P.SKIN_NAMES[i] || "Hautton " + (i + 1), c]), get: () => look().skin, set: (v) => setLook({ skin: v }) },
      { type: "hint", text: opts.personHint || "Deine Figur gilt in allen Spielen von Cold Medal." },
    ];
    // Farben: die Zweitfarbe erscheint erst, wenn ein Muster sie braucht
    const colors = [
      { type: "swatches", label: lbl.suit, aria: "Farbe: " + lbl.suit, list: P.COLORS, get: () => look().suit, set: (v) => setLook({ suit: v }) },
      { type: "seg", label: "Muster", list: P.PATTERNS, get: () => look().pattern, set: (v) => {
        const L = look(), patch = { pattern: v };
        if (v !== "uni" && L.accent === L.suit) patch.accent = L.suit === "#EEF2F7" ? "#262E3B" : "#EEF2F7";   // Muster soll man sehen
        setLook(patch);
      } },
      { type: "swatches", label: lbl.accent, aria: lbl.accent, list: P.COLORS, get: () => look().accent, set: (v) => setLook({ accent: v }), hide: () => look().pattern === "uni" },
    ];
    const tabs = [{ id: "person", label: "Person", pose: pv.personPose, rows: person }, { id: "farben", label: "Farben", pose: pv.colorPose, rows: colors }]
      .concat((opts.tabs || []).filter((t) => t && t.id && Array.isArray(t.rows)));
    const changed = (spec) => { if (spec.head) pose = personPose; refresh(); };
    const boxes = tabs.map((t) => {
      const box = mk("div", "ps-tabbox"); box._id = t.id;
      if (t.id === "person") box.append(idRow, askRow);
      t._rows = t.rows.map((s) => { const r = row(s, changed); box.appendChild(r.el); return r; });
      return box;
    });
    // Zufall gehört zu den Farben (Würfel am Ende der Zeile Muster): Anzug, Muster, Zweitfarbe und die Ausrüstung der Sportart;
    // die Person bleibt
    const bRand = at(mk("button", "ps-plain ps-random"), { type: "button", "aria-label": "Zufällige Farben", title: "Zufällige Farben" });
    bRand.innerHTML = DICE;
    tabs[1]._rows[1].el.appendChild(bRand);
    let code = null;
    if (opts.code) { code = codeTab(opts.code, stop); code.box._id = "code"; boxes.push(code.box); tabs.push({ id: "code", label: "Code", pose: personPose, rows: [], _rows: [] }); }
    const segTab = at(mk("div", "ps-seg ps-tabs"), { role: "tablist", "aria-label": "Was du gestaltest" });
    const tabBtns = tabs.map((t) => { const b = at(mk("button", null, t.label), { type: "button", role: "tab", "aria-selected": "false" }); b._v = t.id; segTab.appendChild(b); return b; });
    opt.append(segTab, ...boxes);
    grid.append(left, opt); dlg.append(head, grid);
    host.appendChild(dlg);

    // ---------------------------------------------------------------- Darstellen
    function refresh() {
      const p = P.get();
      if (doc.activeElement !== selNat) selNat.value = p.nation;
      for (const b of tabBtns) { const on = b._v === tab; b.setAttribute("aria-selected", String(on)); b.setAttribute("aria-checked", String(on)); }
      for (const box of boxes) box.hidden = box._id !== tab;
      for (const t of tabs) if (t.id === tab) for (const r of t._rows) r.sync();
      if (code && tab === "code") code.sync();
      askRow.hidden = !ask;
      cap.textContent = pv.poses.length > 1 ? poseName() + " · antippen für eine andere Haltung" : "";
    }
    function setTab(t) {
      tab = tabs.some((x) => x.id === t) ? t : "person";
      const T = tabs.find((x) => x.id === tab);
      if (T && T.pose) pose = T.pose;
      refresh();
    }
    function drawPreview(t) {
      const cw = cv.clientWidth, ch = cv.clientHeight;
      if (!cw || !ch) return;
      const dpr = Math.min(3, Math.max(1, opts.dpr ? opts.dpr() : root.devicePixelRatio || 1));
      const bw = Math.round(cw * dpr), bh = Math.round(ch * dpr);
      if (cv.width !== bw || cv.height !== bh) { cv.width = bw; cv.height = bh; }
      const c = cv.getContext("2d");
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      try {
        if (opts.preview && opts.preview.draw) opts.preview.draw(c, cw, ch, t, pose, P.get().look);
        else defaultDraw(c, cw, ch, t, pose, P.get().look, tab === "person" || tab === "code" ? opts.personKit || "plain" : opts.kit);
      } catch (e) { /* eine kaputte Vorschau darf das Fenster nicht stören */ }
    }
    const hidden = () => !host.isConnected || host.hidden || doc.hidden || !cv.offsetParent;
    function frame(ts) {
      raf = 0;
      if (!shown) return;
      if (hidden()) { if (Date.now() - openedAt < 1500) raf = root.requestAnimationFrame(frame); return; }   // gleich nach dem Öffnen noch warten
      drawPreview(ts / 1000);
      raf = root.requestAnimationFrame(frame);
    }
    const run = () => { if (shown && !raf && root.requestAnimationFrame) raf = root.requestAnimationFrame(frame); };
    doc.addEventListener("visibilitychange", () => { if (!doc.hidden) run(); });

    // ---------------------------------------------------------------- Bedienen
    function done() {
      const raw = (inName.value || "").trim().slice(0, 12), typed = P.cleanName(upper ? raw.toUpperCase() : raw);
      if (ask && !typed) {
        setTab("person");
        inName.classList.add("ps-need"); askTxt.textContent = "Bitte gib einen Namen ein, oder spiel als Gast."; askTxt.classList.add("ps-warn");
        try { inName.focus(); } catch (e) { /* egal */ }
        return false;
      }
      inName.classList.remove("ps-need"); askTxt.classList.remove("ps-warn");
      const cur = P.get(), name = typed || cur.name || P.cleanName(opts.defaultName || "");
      if (name !== cur.name) P.set({ name, edited: true }, "ui");
      ask = false; shown = false;
      if (opts.onDone) opts.onDone();
      return true;
    }
    function random() {
      const pick = (a) => a[Math.floor(Math.random() * a.length)][0];
      const suit = pick(P.COLORS);
      let accent = pick(P.COLORS);
      while (accent === suit) accent = pick(P.COLORS);
      setLook({ suit, accent, pattern: pick(P.PATTERNS) });
      if (opts.random) opts.random();

    const seed = (Date.now() ^ (Math.random() * 1e9)) >>> 0, a = P.ringer({ st: 0.9, name: R.myName() }), b = P.ringer({ st: gegner.st, typ: gegner.typ, kraft: gegner.kraft, masse: gegner.masse, name: gegner.name }), s = P.kampf(a, b, seed);
    // Anzeige je Ringer: aktuelle Pose (gleitet zur Zielpose), Blickdrehung, Zusatzbewegung
    const V = [{ f: a, art: ICH, dir: 1, pose: PO.steh, x: -1.9, turn: 0.42, kipp: 0, fall: 0 }, { f: b, art: gegner, dir: -1, pose: PO.steh, x: 1.9, turn: 0.42, kipp: 0, fall: 0 }];
    const st = { ph: "einzug", t: 0, faecher: { w: -0.5, seite: 1 }, jubel: 0, beben: 0, zeit: 1, teile: [], banner: null, haelt: false, botAn: false, acc: [0, 0], sperre: 0, tEnde: 0, hinweis: null };
    const staub = (x, n, kraft, farbe) => { for (let i = 0; i < n; i++) st.teile.push({ x: CX + x * PXM + (Math.random() - 0.5) * 30, y: CY + (Math.random() - 0.5) * 10, vx: (Math.random() - 0.5) * 120 * kraft, vy: -Math.random() * 90 * kraft, g: 240, l: 0.5 + Math.random() * 0.5, r: 2 + Math.random() * 3, c: farbe || "rgba(255,255,255,0.85)" }); };
    function eingabe(art) { if (st.ph !== "kampf" || st.sperre > 0) return; if (P.tu(s, a, art)) { st.sperre = 0.12; R.ton.klick(); } }
    function wisch(dx, dy) { st.acc[0] += dx; st.acc[1] += dy; const [x, y] = st.acc; if (Math.hypot(x, y) < 26) return; st.acc = [0, 0]; eingabe(-y > Math.abs(x) ? "griff" : x > 0 ? "schub" : "weich"); }
    function runter() { st.acc = [0, 0]; if (st.ph === "ritual") { st.ph = "hocke"; st.t = 0; } st.haelt = true; }
    function hoch() { st.haelt = false; if (st.ph === "bereit") { const e = P.los(s, a); if (e === "fehlstart") fehlstart(a); } }
    function fehlstart(f) { st.ph = "hocke"; st.t = 0; R.ton.schlecht(); R.sag(f === a ? "Fehlstart! Erst nach dem Zeichen los." : `Fehlstart von ${gegner.name}`, 1.6, f === a); st.faecher.w = -0.5; }
    window.__sumo = { st, s };   // Prüfhaken für Tests und Bildproben
    let px = 0, py = 0, unten = false;
    R.stick({ seite: "rechts", text: "Kampf", onDown: runter, onMove: wisch, onUp: hoch });
    R.szene({
      onDown(x, y) { unten = true; px = x; py = y; runter(); }, onMove(x, y) { if (unten) { wisch(x - px, y - py); px = x; py = y; } }, onUp() { unten = false; hoch(); },
      taste(k, an) { if (st.ph === "kampf") { if (an) eingabe(k === "rechts" ? "schub" : k === "links" ? "weich" : "griff"); } else if (an) runter(); else hoch(); },
      bot() { st.botAn = true; },
      update(dt0) {
        const dt = dt0 * st.zeit; st.t += dt; st.sperre -= dt0; st.jubel = Math.max(0, st.jubel - dt0 * 0.8); st.beben = Math.max(0, st.beben - dt0 * 3);
        if (st.ph === "einzug") { V[0].x += (-0.62 - V[0].x) * Math.min(1, dt * 2.4); V[1].x += (0.62 - V[1].x) * Math.min(1, dt * 2.4); if (st.t > 1.5) { st.ph = "ritual"; st.t = 0; } }
        else if (st.ph === "ritual") { R.tipp("ritual", "Stampfen vertreibt böse Geister, Salz reinigt den Ring. Tippen überspringt.", 4);
          if (st.t > 1.02 && st.t - dt <= 1.02) { R.ton.klack(); st.beben = 0.5; staub(-0.62, 8, 0.6); staub(0.62, 8, 0.6); }
          if (st.t > 2.3 && st.t - dt <= 2.3) for (const v of V) for (let i = 0; i < 16; i++) st.teile.push({ x: CX + v.x * PXM + v.dir * 30, y: CY - 150, vx: v.dir * (60 + Math.random() * 120), vy: -120 - Math.random() * 90, g: 300, l: 0.9 + Math.random() * 0.4, r: 1.6, c: "#FFFFFF" });
          if (st.t > 3.3 || st.botAn) { st.ph = "hocke"; st.t = 0; } }
        else if (st.ph === "hocke") { R.tipp("start", "Halten = Fäuste auf den Boden. Wenn der Fächer fällt: loslassen = Angriff. Zu früh ist ein Fehlstart.", 7); if ((st.haelt || st.botAn) && st.t > 0.5) { st.ph = "bereit"; s.tPh = 0; a.start = b.start = null; st.faecher.w = -1.1; R.ton.tick(); } }
        else if (st.ph === "bereit") {
          if (!st.haelt && !st.botAn && a.start == null && s.tPh < s.signal) { const e = P.los(s, a); if (e === "fehlstart") fehlstart(a); }
          if (st.ph === "bereit") { if (s.tPh >= s.signal && st.faecher.w < 0) { st.faecher.w = 0.9; R.ton.glocke(); R.sag("Hakkeyoi!", 0.9); } if (st.botAn) P.ki(s, a); P.ki(s, b); const ev = P.schritt(s, dt);
            for (const e of ev) if (e.art === "aufprall") { st.ph = "kampf"; st.beben = 1; st.jubel = 1; R.ton.klack(); R.ton.wusch(); staub(s.m, 22, 1.4); R.tippWeg(); if (e.text !== "gleich") R.sag(e.wer === "A" ? "Starker Antritt!" : `${gegner.name} war schneller`, 1.1, e.wer !== "A"); } }
        }
        else if (st.ph === "kampf") {
          R.tipp("kampf", "Wische: nach vorn schieben, zurück ausweichen, hoch greifen. Mit Griff: hoch = Wurf. Lies, was der Gegner ausholt.", 8);
          if (st.botAn) P.ki(s, a); P.ki(s, b); const ev = P.schritt(s, dt); P.nachAkt(a); P.nachAkt(b);
          for (const e of ev) { const ich = e.wer === "A", v = ich ? V[1] : V[0], x = P.ort(s, v.f);
            if (e.art === "schub" || e.art === "draengen") { R.ton.klack(); staub(x, 7, 0.8); st.beben = 0.35; v.treffer = 0.3; }
            else if (e.art === "leere") { R.ton.wusch(); R.sag(ich ? "Ins Leere!" : "Ausgewichen!", 0.9, ich); (ich ? V[0] : V[1]).stolper = 0.6; }
            else if (e.art === "gesprengt") { R.ton.klack(); R.sag(ich ? "Griff gesprengt!" : "Dein Griff ist gesprengt", 0.9, !ich); v.treffer = 0.35; st.beben = 0.5; }
            else if (e.art === "griff" || e.art === "gefangen") { R.ton.knapp(); R.sag(ich ? "Griff am Gürtel!" : `${gegner.name} hat dich am Gürtel`, 1, !ich); }

            else if (e.art === "prall") { R.ton.klack(); st.beben = 0.7; staub(s.m, 10, 1); }

            else if (e.art === "ende") { st.ph = "ende"; st.tEnde = 0; st.zeit = 0.3; st.jubel = 1.4; st.beben = 0.8; st.faecher.seite = ich ? -1 : 1; st.faecher.w = ich ? -1.3 : 1.3; R.tippWeg(); ich ? R.ton.jubel() : R.ton.raunen(); staub(P.ort(s, ich ? b : a), 26, 1.6); st.banner = { titel: e.text, sub: P.KIMARITE[e.text] || "", ich }; } }
        }
        else if (st.ph === "ende") { st.tEnde += dt0; if (st.tEnde > 0.7) st.zeit = 1; if (st.tEnde > 3.4) return fertig({ sieg: s.sieger === "A", kimarite: s.kimarite, dauer: s.t }); }
        // Zielposen
        V.forEach((v, i) => {
          const f = v.f, o = P.andere(s, f), ak = f.akt, K = ak && P.AKT[ak.art]; let ziel = PO.steh, tempo = 9, turn = 0.42, mund = null;
          if (st.ph === "einzug") ziel = misch(PO.steh, PO.kampf, 0.25 + 0.2 * Math.sin(st.t * 9 + i));
          else if (st.ph === "ritual") { const u = st.t; ziel = u < 0.2 ? PO.steh : u < 0.9 ? PO.shikoHoch : u < 1.5 ? PO.shikoTief : u < 2.1 ? PO.steh : u < 2.6 ? PO.salz : PO.steh; tempo = u > 0.9 && u < 1.2 ? 22 : 7; }
          else if (st.ph === "hocke") ziel = PO.hocke;
          else if (st.ph === "bereit") { ziel = f.start != null ? PO.schubAkt : (i === 0 ? st.haelt || st.botAn : true) ? PO.faust : PO.hocke; tempo = f.start != null ? 26 : 8; }
          else if (st.ph === "kampf" || st.ph === "ende") {
            if (st.ph === "ende") { const sieger = (s.sieger === "A") === (i === 0); if (sieger) { ziel = st.tEnde > 0.8 ? PO.sieg : PO.kampf; mund = st.tEnde > 0.8 ? "auf" : null; } else { ziel = s.wie === "raus" ? PO.rueck : PO.liegt; tempo = 7; v.fall = Math.min(1, v.fall + dt * 1.6); } }
            else if (v.stolper > 0) { v.stolper -= dt; ziel = PO.stolper; tempo = 16; }
            else if (v.treffer > 0) { v.treffer -= dt; ziel = PO.treffer; tempo = 18; }
            else if (ak) { const vor = ak.t < K.vor; if (ak.art === "schub") { ziel = vor ? PO.schubVor : PO.schubAkt; tempo = vor ? 9 : 28; } else if (ak.art === "griff") { ziel = vor ? PO.griffVor : PO.griffAkt; tempo = vor ? 8 : 20; } else if (ak.art === "weich") { ziel = PO.weich; turn = 1.25; tempo = 14; } else { ziel = vor ? PO.wurfVor : PO.wurfAkt; turn = vor ? 0.3 : -1.2; tempo = vor ? 9 : 24; } }
            else if (f.griff || o.griff) ziel = misch(PO.griffAkt, PO.kampf, 0.25 + 0.12 * Math.sin(st.t * 6 + i * 2));
            else ziel = misch(PO.kampf, PO.schubVor, 0.12 + 0.12 * Math.sin(st.t * 5 + i * 2));
            if (st.ph === "kampf") v.x = P.ort(s, f); else if (s.wie === "raus" && (s.sieger === "A") !== (i === 0)) v.x += f.seite * dt * 1.4;
          }
          v.pose = misch(v.pose, ziel, Math.min(1, dt * tempo)); v.turn += (turn - v.turn) * Math.min(1, dt * 10); v.mund = mund;
        });
        for (const p of st.teile) { p.l -= dt0; p.x += p.vx * dt0; p.y += p.vy * dt0; p.vy += p.g * dt0; } st.teile = st.teile.filter((p) => p.l > 0);
        // Hinweis über dem Gegner, solange er ausholt (bei den ersten, schwächeren Gegnern)
        const ba = b.akt; st.hinweis = st.ph === "kampf" && ba && ba.t < P.AKT[ba.art].vor && gegner.st < 0.6 ? ba.art : null;
        R.chips([[`${von > 1 ? "Kampf " + nr + " von " + von : "Einzelkampf"}`, "dark"], [`${R.myName()} gegen ${gegner.name}`, "gold"], st.ph === "kampf" ? [a.griff ? "Du hast den Griff" : b.griff ? "Er hat den Griff" : "Offen", a.griff ? "good" : b.griff ? "warn" : ""] : [{ einzug: "Einzug", ritual: "Stampfen und Salz", hocke: "In die Hocke", bereit: "Warten auf das Zeichen", ende: "Entschieden" }[st.ph]]]);
      },
      draw(c, t) {
        c.save(); if (st.beben > 0) c.translate((Math.random() - 0.5) * 9 * st.beben, (Math.random() - 0.5) * 7 * st.beben);
        arena(c, t, st); gyoji(c, t, st);
        for (const v of V) { c.fillStyle = "rgba(60,40,24,0.28)"; c.beginPath(); c.ellipse(CX + v.x * PXM, CY + 4, 62, 13, 0, 0, R.TAU); c.fill(); }
        const reihe = V.slice().sort((p, q) => (p.f.akt && p.f.akt.art === "weich" ? 1 : 0) - (q.f.akt && q.f.akt.art === "weich" ? 1 : 0));
        for (const v of reihe) { const raus = st.ph === "ende" && s.wie === "raus" && v.fall > 0, y = CY + (raus ? v.fall * 46 : 0) + (v.f.akt && v.f.akt.art === "weich" ? 12 : 0);
          yeti(c, CX + v.x * PXM, y, { pose: v.pose, dir: v.dir, turn: v.turn, kipp: raus ? -v.fall * 0.5 : 0, art: Object.assign({}, v.art, { mund: v.mund, auge: st.ph === "ende" && v.fall > 0.5 ? "zu" : null }) }); }
        for (const p of st.teile) { c.globalAlpha = Math.min(1, p.l * 2); c.fillStyle = p.c; c.beginPath(); c.arc(p.x, p.y, p.r, 0, R.TAU); c.fill(); } c.globalAlpha = 1;
        // Gleichgewicht beider Ringer

        if (st.hinweis) { const x = CX + V[1].x * PXM, tx = { schub: "← SCHUB", griff: "GRIFF", weich: "WEICHT AUS", wurf: "WURF" }[st.hinweis]; R.tafel(c, x - 52, 78, 104, 22, [[tx, 11, "#C23B2A"]]); }
        if (st.ph === "kampf") { c.fillStyle = "rgba(20,27,37,0.72)"; c.fillRect(CX - 170, R.H - 30, 340, 22); R.text(c, "→ schieben    ← ausweichen    ↑ " + (a.griff ? "Wurf" : "greifen"), CX, R.H - 19, 12, "#F1E7D2"); }
        if (st.banner && st.tEnde > 0.5) { const b2 = st.banner; R.tafel(c, CX - 170, 78, 340, 70, [[b2.ich ? "SIEG DURCH" : "NIEDERLAGE DURCH", 10, "#8A8F9C"], [b2.titel.toUpperCase(), 30, b2.ich ? "#141B25" : "#C23B2A"], [b2.sub, 12, "#2C6FB3"]]); }
        c.restore();
      },
    });
  }

  function turnier() {
    const erg = []; let i = 0;
    function naechster() { kampf(YETIS[i], i + 1, YETIS.length, (e) => { erg.push(Object.assign({ gegner: YETIS[i] }, e)); i++; tafel(); }); }
    function tafel() {
      const siege = erg.filter((e) => e.sieg).length, fertig = i >= YETIS.length || erg.length - siege >= 4, platz = siege === 7 ? 1 : siege === 6 ? 2 : siege === 5 ? 3 : 9;
      if (fertig) { R.medaille(platz); R.rekord("siege", siege); if (platz <= 3) R.ton.jubel(); }
      R.stand({ kicker: "Nozawa · Yeti-Basho", titel: fertig ? (siege === 7 ? "Turniersieg ohne Niederlage!" : siege >= 4 ? `${siege} Siege: Kachi-koshi` : `${siege} Siege: Make-koshi`) : `${siege} : ${erg.length - siege} nach ${erg.length} Kämpfen`,
        kopf: [["", "p"], ["", ""], ["", ""], ["Technik", "n"], ["", "n"]], zeilen: YETIS.map((y, k) => { const e = erg[k]; return { platz: k + 1, name: y.name, nat: "", spalten: [e ? e.kimarite : k === i && !fertig ? "als Nächster" : ""], wert: e ? (e.sieg ? "○" : "●") : "", ich: k === i && !fertig, strich: false }; }),
        note: fertig ? "○ Sieg, ● Niederlage. Mehr Siege als Niederlagen heißt Kachi-koshi. Sieben Siege sind der Turniersieg." : "Sieben Kämpfe, die Gegner werden stärker. Nach vier Niederlagen ist das Turnier vorbei.",
        knoepfe: fertig ? [{ text: "Menü", fn: R.menu }, { text: "Neues Turnier", rot: true, fn: turnier }] : [{ text: "Weiter", rot: true, fn: naechster }] });
    }
    naechster();
  }
  function einzel() { const g = YETIS[Math.floor(Math.random() * 5)]; kampf(g, 1, 1, (e) => R.stand({ kicker: "Nozawa · Einzelkampf", titel: e.sieg ? "Sieg!" : "Niederlage", kopf: [["", "p"], ["", ""], ["", ""], ["Technik", "n"], ["Dauer", "n"]], zeilen: [{ platz: 1, name: e.sieg ? R.myName() : g.name, nat: "", spalten: [e.kimarite], wert: R.zahl(e.dauer) + " s", ich: e.sieg }, { platz: 2, name: e.sieg ? g.name : R.myName(), nat: "", spalten: [""], wert: "", ich: !e.sieg }], note: P.KIMARITE[e.kimarite] || "", knoepfe: [{ text: "Menü", fn: R.menu }, { text: "Noch einmal", rot: true, fn: einzel }] })); }

  const dSt = { faecher: { w: -0.5, seite: 1 }, jubel: 0 };
  R = window.CMRahmen.spiel({

    modi: [{ id: "turnier", name: "Turnier", sub: (R) => (R.S.best && R.S.best.siege != null ? `Bestes Turnier: ${R.S.best.siege} Siege` : "Sieben Kämpfe, die Gegner werden stärker"), start: turnier },
      { id: "einzel", name: "Einzelkampf", sub: () => "Ein Kampf gegen einen der leichteren Yetis", ohneName: true, start: einzel }],
    info: [["Regeln", "Wie im Sumo: Verloren hat, wer den Ring aus Strohballen verlässt oder mit etwas anderem als den Fußsohlen den Boden berührt. Der Ring misst 4,55 Meter. Ein Kampf dauert meist nur Sekunden."],
      ["Start", "Halten: Dein Yeti setzt die Fäuste auf den Boden. Der Schiedsrichter hebt den Fächer. Wenn der Fächer fällt, loslassen: Wer schneller aus der Hocke kommt, gewinnt den Aufprall. Wer vor dem Zeichen loslässt, hat einen Fehlstart."],
      ["Kampf", "Drei Wische. Nach vorn: schieben. Zurück: ausweichen. Hoch: nach dem Gürtel greifen. Schieben sprengt einen Griff, Greifen fängt den Ausweichenden, Ausweichen lässt den Schub ins Leere laufen. Jede Bewegung holt sichtbar aus: Lies den Gegner."],
      ["Gürtel und Wurf", "Wer den Griff hat, drängt stärker und kann nicht mehr ausmanövriert werden. Hoch wischen wird dann zum Wurf: Er gelingt, wenn der Gegner wackelt, am Rand steht oder gerade selbst angreift. Sonst kostet er dich das Gleichgewicht. Ein Schub löst den Griff des Gegners."],

})();
